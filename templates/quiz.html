{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="quiz-card shadow p-5">

            <!-- HEADER -->

            <div class="d-flex justify-content-between mb-3">

                <h5 class="fw-bold">

                    Tes Gaya Belajar

                </h5>

                <h5 id="questionCounter">

                    1/{{ questions|length }}

                </h5>

            </div>

            <!-- PROGRESS BAR -->

            <div class="progress mb-5">

                <div
                    id="progressBar"
                    class="progress-bar bg-primary"
                    style="width:0%"
                ></div>

            </div>

            <!-- FORM -->

            <form
                action="/result"
                method="POST"
                id="quizForm"
            >

                {% for q in questions %}

                <div

                    class="question-slide {% if loop.index == 1 %}active{% endif %}"
                
                >

                    <!-- PERTANYAAN -->

                    <div class="text-center mb-5">

                        <h2 class="fw-bold">

                            {{ q.question }}

                        </h2>

                    </div>

                    <!-- OPTIONS -->

                    <div class="d-grid gap-4">

                        {% for option in q.options %}

                        <button

                            type="button"

                            class="btn btn-light shadow-lg p-4 text-start answer-card"

                            onclick="selectAnswer(
                                '{{ q.id }}',
                                '{{ option.type }}',
                                this
                            )"
                        >

                            <h5 class="mb-0">

                                {{ option.text }}

                            </h5>

                        </button>

                        {% endfor %}

                    </div>

                    <!-- HIDDEN INPUT -->

                    <input
                        type="hidden"
                        name="{{ q.id }}"
                        id="answer{{ q.id }}"
                    >

                </div>

                {% endfor %}

            </form>

        </div>

    </div>

</div>

<style>

.answer-card {

    border-radius: 20px;

    transition: 0.2s;

    border: none;

    background: white;

}

.answer-card:hover {

    transform: translateY(-3px);

    background: #eef2ff;

}

.question-slide {

    opacity: 0;

    transform: translateX(30px);

    transition:
        all 0.4s ease;

    display: none;

}

.question-slide.active {

    display: block;

    opacity: 1;

    transform: translateX(0);

}

.answer-card {

    border-radius: 24px;

    transition:
        all 0.25s ease;

    border: none;

    background: white;

    min-height: 90px;

}

.answer-card:hover {

    transform:
        translateY(-5px)
        scale(1.01);

    background: #eef2ff;

}

.answer-card.selected {

    transform: scale(0.97);

    opacity: 0.8;

}

.progress {

    height: 14px;

    border-radius: 30px;

    overflow: hidden;

    background: #e9ecff;

}

.progress-bar {

    transition:
        width 0.4s ease;

}

@media (max-width: 768px) {

    .quiz-card {

        padding: 24px !important;

        border-radius: 24px;

    }

    .question-slide h2 {

        font-size: 1.3rem;

        line-height: 1.6;

    }

    .answer-card {

        min-height: 75px;

        padding: 18px !important;

    }

}

@keyframes fadeIn {

    from {

        opacity: 0;

        transform: translateY(10px);

    }

    to {

        opacity: 1;

        transform: translateY(0);

    }

}

</style>

<script>

const slides =
document.querySelectorAll('.question-slide');

let current = 0;

function updateProgress() {

    const progress =
    ((current + 1) / slides.length) * 100;

    document.getElementById(
        'progressBar'
    ).style.width = progress + '%';

    document.getElementById(
        'questionCounter'
    ).innerText =
    `${current + 1}/${slides.length}`;

}

updateProgress();

function selectAnswer(
    questionId,
    value,
    button
) {

    document.getElementById(
        'answer' + questionId
    ).value = value;

    button.classList.add(
        'selected'
    );

    setTimeout(() => {

        slides[current].classList.remove(
            'active'
        );

        current++;

        if(current < slides.length) {

            slides[current].classList.add(
                'active'
            );

            updateProgress();

        }

        else {

            document.getElementById(
                'quizForm'
            ).submit();

        }

    }, 250);

}

</script>

{% endblock %}
